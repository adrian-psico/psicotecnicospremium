<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago realizado</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f4efe9] p-4">
    <div class="max-w-2xl w-full rounded-[2rem] bg-white border border-[#134254]/20 shadow-xl p-8 text-center">
        <h1 class="text-2xl sm:text-3xl font-bold text-[#134254]">El pago se ha realizado con éxito, usted recibirá toda la información por mail</h1>
    </div>
    <script>
async function enviarDatosPendientes() { const datosGuardados = localStorage.getItem('registroEmpresaPendiente'); if (!datosGuardados) return; try { const datos = JSON.parse(datosGuardados); const formData = new FormData(); Object.keys(datos).forEach(key => formData.append(key, datos[key])); const response = await fetch('https://formspree.io/f/xeernyaa', { method: 'POST', body: formData, headers: { 'Accept': 'application/json' } }); if (response.ok) { localStorage.removeItem('registroEmpresaPendiente'); } } catch (error) { console.error('No se pudieron enviar los datos a Formspree.', error); } } enviarDatosPendientes();
    </script>
</body>
</html>
