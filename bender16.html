<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Bender - Psicotécnicos Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --brand-primary: #134254;
            --brand-primary-dark: #0f3442;
            --brand-bg: #f4efe9;
            --brand-card: #ffffff;
            --brand-muted: #64748b;
        }
        html, body { background-color: #f4efe9 !important; margin: 0; min-height: 100%; }
        body { -webkit-text-size-adjust: 100%; background-color: #f4efe9 !important; background-image: none !important; color: #172026; min-height: 100vh; }
        .page-bg { background-color: #f4efe9 !important; background-image: none !important; }
        .professional-card { background: #ffffff; border: 1px solid rgba(19, 66, 84, 0.12); box-shadow: 0 18px 45px rgba(15, 52, 66, 0.10); }
        .glass-panel { background: #134254; box-shadow: 0 30px 80px rgba(15, 52, 66, 0.28); }
        .btn-primary { background: var(--brand-primary); box-shadow: 0 16px 30px rgba(19, 66, 84, 0.25); }
        .btn-primary:hover { background: var(--brand-primary-dark); }
        .lamina-img { max-height: 300px; box-shadow: 0 18px 45px rgba(15, 52, 66, 0.10); border-radius: 12px; margin: 0 auto; background: #ffffff; padding: 15px; }
    </style>
</head>

<body class="page-bg font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div id="test-container" class="professional-card max-w-4xl w-full rounded-[2rem] overflow-hidden">

        <div class="bg-white py-3 text-center border-b border-[#134254]/10">
            <span class="text-teal-900 font-bold italic tracking-tight">Psicotécnicos Premium</span>
        </div>

        <!-- Nombre y empresa -->
        <p id="nombreMostrado" class="text-center text-gray-700 text-sm mt-3 px-4 break-words min-h-[1.25rem]"></p>
        <p id="empresaMostrada" class="text-center text-gray-600 text-sm mb-3 px-4 break-words min-h-[1.25rem]"></p>

        <div class="glass-panel p-6 text-white text-center">
            <span class="text-white font-light text-sm">
                <u><strong>Consigna</strong></u> :
                <span class="text-blue-100 font-light text-sm opacity-95">Dibujá la figura en una hoja blanca. Al terminar, subí una foto nítida.</span>
            </span>
        </div>
        <div class="text-center bg-white py-4 px-6 border-b border-[#134254]/10">
            <button id="btn-ayuda" onclick="toggleAyuda()" class="btn-primary text-white py-3 px-6 rounded-xl font-light shadow-lg transition-all focus:outline-none" style="background-color:#134254;" onmouseover="this.style.backgroundColor='#134254'" onmouseout="this.style.backgroundColor='#0f3442'">Necesitás ayuda?</button>
            <div id="banner-ayuda" class="hidden mt-4 mx-auto max-w-xl rounded-2xl bg-[#b4bebf] border border-[#134254]/20 text-[#134254] font-semibold px-5 py-4">Mensaje de ayuda</div>
        </div>

        <div class="p-8 md:p-12 bg-white">

            <div class="mb-8">
                <div class="flex justify-between text-xs font-bold text-teal-900 uppercase mb-2">
                    <span id="progreso-texto">Figura 1 de 9</span>
                    <span id="porcentaje-texto">11%</span>
                </div>
                <div class="w-full bg-[#f4efe9] rounded-full h-2">
                    <div id="progreso-barra" class="h-2 rounded-full transition-all duration-500" style="width: 11%; background-color:#134254;"></div>
                </div>
            </div>

            <div id="content" class="space-y-8">

                <div class="text-center bg-[#f4efe9] p-6 rounded-2xl border border-[#134254]/10">
                    <img id="lamina-display" src="b1.jpeg" alt="Lámina Bender" class="lamina-img">
                </div>

                <div class="bg-[#f4efe9] p-8 rounded-2xl border-2 border-dashed border-[#134254]/20 text-center">
                    <input type="file" id="file-input" accept="image/*" capture="environment"
                        class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 
                        file:rounded-full file:border-0 file:text-sm file:font-semibold 
                        file:bg-[#134254] file:text-white hover:file:bg-[#0f3442] cursor-pointer">
                    <p id="status-msg" class="text-[10px] text-teal-900 mt-2 uppercase"></p>
                </div>

                <button id="btn-siguiente" onclick="procesarImagen()"
                    class="btn-primary w-full text-white py-4 rounded-xl font-bold shadow-lg transform hover:scale-[1.01] transition-all focus:outline-none focus:ring-4 focus:ring-[#134254]/25" style="background-color:#134254;" onmouseover="this.style.backgroundColor='#0f3442'" onmouseout="this.style.backgroundColor='#134254'">
                    Confirmar y Siguiente
                </button>

            </div>
        </div>
    </div>

    <!-- Campos ocultos -->
    <input type="hidden" id="evaluado" name="Evaluado">
    <input type="hidden" id="empresa" name="Empresa">

    <script>

        /* ----------------------------------------------------
           1) TOMAR NOMBRE Y EMPRESA DESDE LA URL
        ---------------------------------------------------- */
        const params = new URLSearchParams(window.location.search);
        const nombreEvaluado = params.get("nombre");
        const empresaNombre = params.get("empresa");

        const nombreLimpio = String(nombreEvaluado || '').trim();
        const empresaLimpia = String(empresaNombre || '').trim();
        document.getElementById("evaluado").value = nombreLimpio;
        document.getElementById("empresa").value = empresaLimpia;
        document.getElementById("nombreMostrado").textContent = nombreLimpio ? "Evaluando a: " + nombreLimpio : "Evaluando a: (no encontrado)";

        document.getElementById("empresaMostrada").textContent = empresaLimpia ? "Empresa: " + empresaLimpia : "Empresa: (no encontrado)";

        function toggleAyuda() {
            const bannerAyuda = document.getElementById('banner-ayuda');
            bannerAyuda.classList.toggle('hidden');
        }
        /* ----------------------------------------------------
           2)  BENDER
        ---------------------------------------------------- */
        const figuras = ["b1.jpeg", "b2.jpeg", "b3.jpeg", "b4.jpeg", "b5.jpeg", "b6.jpeg", "b7.jpeg", "b8.jpeg", "b9.jpeg"];
        let pasoActual = 0;
        let imagenesComprimidas = [];

        async function procesarImagen() {
            const fileInput = document.getElementById('file-input');
            const btn = document.getElementById('btn-siguiente');
            const status = document.getElementById('status-msg');

            if (fileInput.files.length === 0) {
                alert("Por favor, suba la foto del dibujo.");
                return;
            }

            btn.disabled = true;
            status.innerText = "Procesando imagen...";

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;

                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    const MAX_WIDTH = 1200;
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        imagenesComprimidas.push(blob);
                        status.innerText = "";
                        btn.disabled = false;
                        avanzarOEnviar();
                    }, 'image/jpeg', 0.7);
                };
            };
        }

        function avanzarOEnviar() {
            if (pasoActual < figuras.length - 1) {
                pasoActual++;
                document.getElementById('lamina-display').src = figuras[pasoActual];
                document.getElementById('file-input').value = "";
                
                const porc = ((pasoActual + 1) / 9) * 100;
                document.getElementById('progreso-texto').innerText = `Figura ${pasoActual + 1} de 9`;
                document.getElementById('porcentaje-texto').innerText = Math.round(porc) + "%";
                document.getElementById('progreso-barra').style.width = porc + "%";
                window.scrollTo(0,0);
            } else {
                enviarFinal();
            }
        }

        async function enviarFinal() {
            const btn = document.getElementById('btn-siguiente');
            btn.disabled = true;
            btn.innerText = "Enviando Respuestas...";

            const formData = new FormData();

            imagenesComprimidas.forEach((blob, i) => {
                formData.append(`Figura_${i+1}`, blob, `figura_${i+1}.jpg`);
            });

            formData.append("Profesional", "Lic. Andrea Civati");
            formData.append("Empresa", empresaNombre || "");
            formData.append("Evaluado", nombreEvaluado || "");
            formData.append("Test", "Bender");

            try {
                const response = await fetch("https://formspree.io/f/mreaggra", {
                    method: "POST",
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    redirigirSiguiente();
                } else {
                    alert("Error en el envío de Formspree.");
                    btn.disabled = false;
                }
            } catch (error) {
                alert("Error de red. Intente nuevamente.");
                btn.disabled = false;
            }
        }

        function redirigirSiguiente() {
            setTimeout(() => {
                window.location.href =
                    "graficos15.html?nombre=" + encodeURIComponent(nombreEvaluado) +
                    "&empresa=" + encodeURIComponent(empresaNombre || "");
            }, 800);
        }

    </script>
</body>
</html>
